<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Review Link Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 sm:p-8 space-y-6">
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-slate-800">Google Review Link Generator</h1>
      <p class="text-xs text-slate-500">Paste your Maps share link to get an instant 1-click review link & QR code.</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Google Maps URL</label>
        <input
          id="mapsUrl"
          type="url"
          placeholder="https://maps.app.goo.gl/..."
          class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none transition"
        />
      </div>

      <button
        id="convertBtn"
        onclick="generateLink()"
        class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-medium py-3 rounded-xl text-sm transition shadow-sm"
      >
        Generate Review Link
      </button>

      <div id="status" class="text-xs text-center font-medium hidden"></div>
    </div>

    <div id="resultBox" class="hidden space-y-4 border-t border-slate-100 pt-5">
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Direct Review Link</label>
        <div class="flex gap-2">
          <input
            id="outputLink"
            type="text"
            readonly
            class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono text-slate-700"
          />
          <button
            onclick="copyLink()"
            class="px-4 py-2 bg-slate-900 hover:bg-black text-white text-xs font-medium rounded-lg transition"
          >
            Copy
          </button>
        </div>
      </div>

      <div class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-100 space-y-3">
        <p class="text-xs text-slate-500 font-medium">Scan to Leave a Review</p>
        <img id="qrCode" alt="QR Code" class="w-36 h-36 rounded-lg bg-white p-2 shadow-sm" />
      </div>

      <div class="text-center">
        <a id="previewBtn" href="#" target="_blank" class="text-blue-600 text-xs font-semibold hover:underline">
          Test Review Link &rarr;
        </a>
      </div>
    </div>
  </div>

  <script>
    async function generateLink() {
      const url = document.getElementById('mapsUrl').value.trim();
      const status = document.getElementById('status');
      const resultBox = document.getElementById('resultBox');
      const convertBtn = document.getElementById('convertBtn');

      if (!url) return;

      status.className = 'text-xs text-center text-blue-600 block';
      status.innerText = 'Extracting Place ID...';
      convertBtn.disabled = true;

      try {
        const response = await fetch('/api/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Failed to generate link');

        document.getElementById('outputLink').value = data.reviewUrl;
        document.getElementById('previewBtn').href = data.reviewUrl;
        document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(data.reviewUrl)}`;

        resultBox.classList.remove('hidden');
        status.className = 'text-xs text-center text-green-600 block';
        status.innerText = 'Review link generated!';
      } catch (err) {
        status.className = 'text-xs text-center text-red-600 block';
        status.innerText = err.message;
        resultBox.classList.add('hidden');
      } finally {
        convertBtn.disabled = false;
      }
    }

    function copyLink() {
      const copyText = document.getElementById('outputLink');
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert('Copied to clipboard!');
    }
  </script>
</body>
</html>
